name: Pipeline Salud

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ejecutar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Descargar Synthea
        run: curl -L -o synthea-with-dependencies.jar https://github.com/synthetichealth/synthea/releases/download/v3.3.0/synthea-with-dependencies.jar

      - name: Generar pacientes sinteticos
        run: java -jar synthea-with-dependencies.jar -p 20

      - name: Ejecutar pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          python este_archivo_no_existe.py

      - name: Notificar error por Telegram
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚨 *PIPELINE SALUD FHIR FALLÓ* 🚨
            
            El pipeline falló en el commit ${{ github.sha }}.
            Revisá los logs acá: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
