name: Pipeline Salud

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ejecutar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Descargar Synthea
        run: curl -L -o synthea-with-dependencies.jar https://github.com/synthetichealth/synthea/releases/download/v3.3.0/synthea-with-dependencies.jar

      - name: Generar pacientes sinteticos
        run: java -jar synthea-with-dependencies.jar -p 20

      - name: Ejecutar pipeline
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "DB_PASSWORD=$DB_PASSWORD" > .env
          python load.py